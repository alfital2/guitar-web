<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Guitar Studio — a warm vacuum tube glowing on the dark stage -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="58%" r="60%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity=".95"/>
      <stop offset="45%" stop-color="#ff8a2c" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ff8a2c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6dc"/>
      <stop offset="100%" stop-color="#ff9a3c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="22%" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".12"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#101014"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="13.4" fill="none" stroke="#2a2a31" stroke-width="1.5"/>
  <!-- warm halo -->
  <circle cx="32" cy="34" r="22" fill="url(#glow)"/>
  <!-- tube envelope -->
  <path d="M22 18a10 10 0 0 1 20 0v24a4 4 0 0 1-4 4H26a4 4 0 0 1-4-4z"
        fill="rgba(255,170,80,.16)" stroke="url(#glass)" stroke-width="2"/>
  <!-- anode column -->
  <rect x="27.5" y="18" width="9" height="24" rx="2" fill="rgba(60,38,20,.55)"/>
  <!-- filament -->
  <rect x="30.6" y="16" width="2.8" height="26" rx="1.4" fill="url(#fil)"/>
  <rect x="30.6" y="16" width="2.8" height="26" rx="1.4" fill="url(#fil)" opacity=".7" transform="translate(0 .5)"/>
  <!-- getter flash -->
  <ellipse cx="32" cy="12.5" rx="4.4" ry="2.6" fill="rgba(200,214,226,.55)"/>
  <!-- socket -->
  <rect x="23" y="47.5" width="18" height="6.5" rx="2.4" fill="#26262c"/>
  <rect x="23" y="47.5" width="18" height="2.2" rx="1.1" fill="#3a3a42"/>
</svg>
