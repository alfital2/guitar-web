name: Deploy to GitHub Pages

on:
  push:
    branches: [wow-backgrounds]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site (runtime files only — keep the artifact small)
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='_site' \
            --exclude='node_modules' \
            --exclude='shots' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='.superpowers' \
            --exclude='.qa-learnings' \
            --exclude='.maestro' \
            --exclude='docs' \
            --exclude='tests' \
            --exclude='tools' \
            --exclude='.DS_Store' \
            ./ _site/
          echo "staged site size:"; du -sh _site
          ls -la _site | head

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
