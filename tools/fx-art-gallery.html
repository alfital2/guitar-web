<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>FX Faceplate Gallery — dev QA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Inline&family=Audiowide&family=Orbitron:wght@600;800&family=Special+Elite&family=Major+Mono+Display&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#0d0d10;color:#e8e8ea;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;padding:28px}
  h1{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#6a6a70;margin:0 0 20px}
  .grid{display:flex;flex-wrap:wrap;gap:18px 16px;align-items:flex-start;max-width:1180px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:8px}
  .cap{font-size:11px;color:#8a8a90}
  .pedal{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 14px 36px rgba(0,0,0,.66)}
  .pedal svg.face{display:block;width:100%;height:auto}
  .knobs{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:15px;z-index:2}
  .knob{width:27px;height:27px;border-radius:50%;background:radial-gradient(circle at 38% 28%,#4a4a52,#141417 75%);
    border:1px solid rgba(0,0,0,.7);box-shadow:inset 0 1px 1px rgba(255,255,255,.18),0 3px 6px rgba(0,0,0,.6);position:relative}
  .knob::after{content:"";position:absolute;top:2px;left:50%;width:2px;height:9px;background:var(--c,#f4f4f6);transform:translateX(-50%) rotate(22deg);transform-origin:bottom;border-radius:1px;box-shadow:0 0 3px var(--c)}
  .foot{position:absolute;left:0;right:0;bottom:0;height:18px;background:linear-gradient(180deg,rgba(0,0,0,.4),rgba(0,0,0,.78));display:flex;align-items:center;justify-content:center;z-index:2}
  .foot::after{content:"";width:44%;height:4px;border-radius:3px;background:rgba(0,0,0,.55)}
  .led{position:absolute;top:-3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--c);box-shadow:0 0 7px var(--c),0 0 2px #fff}
</style></head>
<body>
<h1>FX Faceplate Gallery — bespoke</h1>
<div class="grid" id="grid"></div>
<script type="module">
  import { FX_COLORS, FX_KNOBS, fxWidth, fxArtSvg, ensureFxArtSheet } from '../src/chain-ui/fx-art.js';
  ensureFxArtSheet();
  const TYPES = [
    ['compressor','Compressor'],['boost','Boost'],['gate','Noise Gate'],['fuzz','Fuzz'],['octave','Octave Fuzz'],
    ['wah','Wah'],['autowah','Auto-Wah'],['chorus','Chorus'],['flanger','Flanger'],['phaser','Phaser'],
    ['tremolo','Tremolo'],['vibrato','Vibrato'],['autopan','Auto-Pan'],['rotary','Rotary'],['ringmod','Ring Mod'],
    ['delay','Delay'],['tape-echo','Tape Echo'],['pingpong','Ping-Pong'],['reverb','Reverb'],['widener','Widener'],
    ['limiter','Limiter'],['pitchshift','Pitch Shift'],['looper','Looper'],
  ];
  const ART_H = 248, KNOB_CY = 134; // knob-band center in art coords
  const grid = document.getElementById('grid');
  for (const [type,label] of TYPES) {
    const c = FX_COLORS[type] ?? '#aaa';
    const aw = fxWidth(type), n = FX_KNOBS[type] ?? 3;
    const cell = document.createElement('div'); cell.className='cell';
    const pedal = document.createElement('div'); pedal.className='pedal'; pedal.style.width = aw+'px'; pedal.style.setProperty('--c', c);
    const art = fxArtSvg(type); art.classList.add('face');
    pedal.appendChild(art);
    const knobs = document.createElement('div'); knobs.className='knobs';
    knobs.style.top = (KNOB_CY - 13.5) + 'px';
    knobs.innerHTML = Array.from({length:n}, ()=> '<div class="knob"></div>').join('');
    const foot = document.createElement('div'); foot.className='foot'; foot.innerHTML='<div class="led"></div>';
    pedal.append(knobs, foot);
    const cap = document.createElement('div'); cap.className='cap'; cap.textContent=`${label} · ${n}k`;
    cell.append(pedal, cap); grid.appendChild(cell);
  }
</script>
</body></html>
