<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Amp head — WOW rebuild</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(120% 100% at 50% 0%, #201f24, #0e0e10 70%);
    color: #f2f2f7; font: 14px/1.4 'Inter', system-ui, sans-serif; padding: 40px 24px; }
  h1 { font-size: 19px; font-weight: 800; margin: 0 0 20px; text-align: center; }
  .wrap { max-width: 1160px; margin: 0 auto; }

  /* ── Amp head ─────────────────────────────────────────────────────── */
  .amp { --gold: #e6b453; position: relative; border-radius: 16px; padding: 20px; isolation: isolate;
    /* Real tolex/leather: SVG diffuse-lit fractal noise (embossed pebble grain)
       blended over a dark base. */
    background:
      /* form shading (top light → bottom shade), over the tolex */
      linear-gradient(180deg, rgba(255,255,255,0.05), transparent 14%, rgba(0,0,0,0.32)),
      /* fine black leather grain: small fractal bumps, VERY dark light so only the
         bump-tips catch a faint grey highlight on an otherwise black hide. */
      url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='200'%20height='200'%3E%3Cfilter%20id='t'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.55'%20numOctaves='2'%20seed='6'%20stitchTiles='stitch'%20result='n'/%3E%3CfeDiffuseLighting%20in='n'%20surfaceScale='2.6'%20diffuseConstant='0.9'%20lighting-color='%23202024'%3E%3CfeDistantLight%20azimuth='235'%20elevation='52'/%3E%3C/feDiffuseLighting%3E%3C/filter%3E%3Crect%20width='200'%20height='200'%20filter='url(%23t)'/%3E%3C/svg%3E") 0 0 / 200px 200px;
    box-shadow: 0 40px 70px -20px rgba(0,0,0,0.8), inset 0 2px 0 rgba(255,255,255,0.08),
      inset 0 0 0 2px #000, inset 0 0 0 3px rgba(255,255,255,0.05); }
  /* leather handle */
  .handle { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); width: 190px; height: 26px; z-index: 5; }
  .handle::before { content: ''; position: absolute; inset: 8px 0 0; border-radius: 9px;
    background: linear-gradient(180deg, #3a3a3e, #1c1c1f); box-shadow: 0 3px 6px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.15); }
  .handle span { position: absolute; top: 0; width: 30px; height: 26px; border-radius: 7px;
    background: linear-gradient(180deg, #454549, #232326); box-shadow: 0 3px 5px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2); }
  .handle span.l { left: 6px; } .handle span.r { right: 6px; }
  .corner { position: absolute; width: 30px; height: 30px; z-index: 4;
    background: linear-gradient(135deg, #55565a, #2a2a2d); border-radius: 5px;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.25), 0 2px 3px rgba(0,0,0,0.5); }
  .corner::after { content: ''; position: absolute; inset: 9px; border-radius: 50%;
    background: radial-gradient(circle at 36% 32%, #eef, #9aa 40%, #556 72%, #223); }
  .corner.tl { top: 8px; left: 8px; } .corner.tr { top: 8px; right: 8px; }
  .corner.bl { bottom: 8px; left: 8px; } .corner.br { bottom: 8px; right: 8px; }

  /* control panel: brushed graphite with gold engraving + glass */
  /* Reflective brushed gold-metal faceplate (real amp panel), dark-engraved labels. */
  .panel { position: relative; margin: 6px 34px 16px; border-radius: 12px; padding: 14px 22px 12px;
    display: flex; gap: 20px; overflow: hidden;
    background:
      /* crisp reflected light streaks (mirror shine) */
      linear-gradient(118deg, transparent 15%, rgba(255,255,255,0.95) 18.5%, transparent 22%,
        transparent 50%, rgba(255,255,255,0.75) 53.5%, transparent 57%,
        transparent 74%, rgba(255,255,255,0.6) 77%, transparent 80%),
      /* polished silver chrome — bright, high-key, no dark band through the knobs */
      linear-gradient(180deg, #eef1f4 0%, #ffffff 11%, #c6ccd2 30%, #b0b7be 45%, #d2d8dd 60%, #f4f7fa 78%, #b6bdc3 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,1), inset 0 -2px 6px rgba(0,0,0,0.22),
      0 3px 8px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,0,0,0.5); }
  .sec { display: flex; flex-direction: column; }
  .sec + .sec { border-left: 1px solid rgba(0,0,0,0.28); box-shadow: -1px 0 0 rgba(255,255,255,0.55); padding-left: 20px; }
  .sec-h { text-align: center; font: 800 10px 'Inter'; letter-spacing: .16em; color: #2a2c31;
    text-shadow: 0 1px 0 rgba(255,255,255,0.6); margin-bottom: 8px; }
  .row { display: flex; gap: 22px; }

  /* premium amp knob: chrome skirt + black cap + white pointer + amber value arc */
  .k { position: relative; width: 31px; height: 31px; }
  .k .arc { position: absolute; inset: -4px; border-radius: 50%;
    background:
      conic-gradient(from 225deg, var(--gold) calc(var(--v) * 270deg), rgba(0,0,0,0) 0),
      conic-gradient(from 225deg, rgba(0,0,0,0.55) 270deg, rgba(0,0,0,0) 0);
    -webkit-mask: radial-gradient(transparent 56%, #000 59%, #000 100%);
    mask: radial-gradient(transparent 56%, #000 59%, #000 100%);
    filter: drop-shadow(0 0 3px rgba(230,180,83,0.4)); }
  .k .skirt { position: absolute; inset: 0; border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, #cfd4d9 0deg 2deg, #6b7076 2deg 4deg);
    box-shadow: 0 2px 5px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(0,0,0,0.5); }
  .k .cap { position: absolute; inset: 4px; border-radius: 50%;
    background: radial-gradient(circle at 38% 30%, #4a4a50, #26262b 46%, #131316 100%);
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.25), inset 0 -2px 4px rgba(0,0,0,0.7), 0 1px 1px rgba(0,0,0,0.5); }
  .k .dial { position: absolute; inset: 4px; border-radius: 50%; transform: rotate(calc(-135deg + var(--v) * 270deg)); }
  .k .dial .ptr { position: absolute; top: 2px; left: 50%; width: 2.5px; height: 10px; margin-left: -1.25px; border-radius: 2px;
    background: linear-gradient(#fff, #cfd3d7); box-shadow: 0 0 2px rgba(0,0,0,0.6); }
  .k b { position: absolute; top: 35px; left: 50%; transform: translateX(-50%); white-space: nowrap;
    font: 800 7.5px 'Inter'; letter-spacing: .03em; color: #2a2c31; text-shadow: 0 1px 0 rgba(255,255,255,0.55); }
  .lbls { display: flex; gap: 12px; margin-top: 20px; }
  .lbls span { width: 40px; text-align: center; font: 800 8px 'Inter'; letter-spacing: .03em; color: #c9ccd1; text-shadow: 0 1px 0 rgba(0,0,0,0.6); }

  /* speaker grille with glowing tubes behind woven cloth */
  .grille { position: relative; margin: 0 34px; height: 190px; border-radius: 12px; overflow: hidden;
    background: linear-gradient(180deg, #14100c, #0b0908);
    box-shadow: inset 0 0 0 3px #000, inset 0 2px 10px rgba(0,0,0,0.8); }
  .tubes { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 70px; z-index: 1; }
  .tube { position: relative; width: 40px; height: 108px; border-radius: 20px 20px 8px 8px;
    background: linear-gradient(180deg, rgba(255,180,90,0.25), rgba(255,120,40,0.5) 55%, rgba(120,50,10,0.6));
    box-shadow: 0 0 40px 14px rgba(255,140,50,0.4), inset 0 0 14px rgba(255,220,150,0.6);
    animation: tube 3.4s ease-in-out infinite; }
  .tube::before { content: ''; position: absolute; left: 50%; top: 22px; transform: translateX(-50%); width: 4px; height: 64px;
    background: linear-gradient(180deg, #fff3d0, #ff8a2c); border-radius: 2px; box-shadow: 0 0 10px 3px rgba(255,180,80,0.9); }
  .tube:nth-child(2) { animation-delay: .6s; } .tube:nth-child(3) { animation-delay: 1.2s; } .tube:nth-child(4) { animation-delay: 1.8s; }
  @keyframes tube { 0%,100% { opacity: .8; } 50% { opacity: 1; } }
  /* woven mesh cloth over the tubes */
  .mesh { position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background:
      radial-gradient(circle at 50% 50%, rgba(0,0,0,0.55) 0.9px, transparent 1.4px) 0 0 / 5px 5px,
      radial-gradient(circle at 50% 50%, rgba(0,0,0,0.55) 0.9px, transparent 1.4px) 2.5px 2.5px / 5px 5px,
      linear-gradient(180deg, rgba(255,255,255,0.04), transparent 40%);
    box-shadow: inset 0 0 60px rgba(0,0,0,0.6); }
  .logo { position: absolute; left: 26px; bottom: 18px; z-index: 3; font-family: 'Pacifico', cursive; font-size: 40px;
    background: linear-gradient(180deg, #fff, #b7bcc2 55%, #6a6f75); -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.7)); }
  .pw { position: absolute; right: 26px; bottom: 24px; z-index: 3; display: flex; align-items: center; gap: 9px; }
  .pw .jewel { width: 15px; height: 15px; border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #fff, #ffcf6a 34%, #e07a10 70%, #7a3d00);
    box-shadow: 0 0 14px 4px rgba(255,150,40,0.8), inset 0 -1px 2px rgba(0,0,0,0.5); animation: jewel 2.4s ease-in-out infinite; }
  @keyframes jewel { 0%,100% { box-shadow: 0 0 14px 4px rgba(255,150,40,0.8), inset 0 -1px 2px rgba(0,0,0,0.5); } 50% { box-shadow: 0 0 8px 2px rgba(255,150,40,0.5), inset 0 -1px 2px rgba(0,0,0,0.5); } }
  .pw span { font: 800 9px 'Inter'; letter-spacing: .14em; color: #d8d8dd; }
  @media (prefers-reduced-motion: reduce) { .tube, .pw .jewel { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Amp head — WOW rebuild (glowing tubes · brushed-gold panel · premium knobs)</h1>
  <div class="amp">
    <div class="handle"><span class="l"></span><span class="r"></span></div>
    <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <div class="panel" id="panel"></div>
    <div class="grille">
      <div class="tubes"><div class="tube"></div><div class="tube"></div><div class="tube"></div><div class="tube"></div></div>
      <div class="mesh"></div>
      <div class="logo">Studio</div>
      <div class="pw"><span class="jewel"></span><span>POWER</span></div>
    </div>
  </div>
</div>
<script>
  const SEC = [
    ['DRIVE', ['AMOUNT','TONE','LEVEL','MASTER','BLEND','MID BUMP']],
    ['EQ', ['BASS','MID','MID FREQ','TREBLE']],
    ['CABINET', ['BRIGHTNESS','BODY','PRESENCE','MIX']],
    ['REVERB', ['SIZE','MIX']],
  ];
  // deterministic-ish static knob values
  const vs = [.72,.5,.55,.62,.65,.35, .58,.7,.5,.6, .45,.6,.55,.8, .5,.32];
  let i = 0;
  const panel = document.getElementById('panel');
  for (const [name, knobs] of SEC) {
    const sec = document.createElement('div'); sec.className = 'sec';
    const row = knobs.map(l => {
      const v = vs[i++] ?? .5;
      return `<div class="k" style="--v:${v}"><i class="arc"></i><i class="skirt"></i><i class="cap"></i><i class="dial"><i class="ptr"></i></i><b>${l}</b></div>`;
    }).join('');
    sec.innerHTML = `<div class="sec-h">${name}</div><div class="row">${row}</div>`;
    panel.appendChild(sec);
  }
</script>
</body>
</html>
