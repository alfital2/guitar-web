<!doctype html>
<!-- Loudness audit harness: renders EVERY preset's full chain (amp + effects +
     amp reverb + the app's own normalization gain) against a deterministic
     guitar-like test signal in an OfflineAudioContext, and measures integrated
     loudness (LUFS, ITU-R BS.1770-4). Everything runs silently in-memory —
     nothing is ever connected to speakers. Driven by tests/loudness-audit.mjs
     via window.__loudnessAudit.run(). -->
<meta charset="utf-8">
<title>loudness audit</title>
<body>
<script type="module">
import { GB_CATEGORIES } from '../src/presets.js';
import { registry } from '../src/effects/index.js';
import { buildChain } from '../src/engine.js';
import * as chainState from '../src/chain-state.js';
import { loadWorklets } from '../src/effects/worklets/index.js';
import * as reverbFx from '../src/effects/reverb.js';
import {
  measureLoudnessGain, isNeuralChain, integratedLufs, TARGET_LUFS,
} from '../src/normalize.js';

const SR = 48000;

// ── main.js replica (keep in lockstep with src/main.js) ───────────────────
function extractReverb(chainData) {
  const rev = chainData.filter((e) => e.type === 'reverb');
  return {
    rest: chainData.filter((e) => e.type !== 'reverb'),
    reverb: rev.length ? { size: 0.4, mix: 0.12, ...rev[rev.length - 1].params } : null,
  };
}

// ── Deterministic guitar-like VERIFICATION signal ──────────────────────────
// Deliberately DIFFERENT from normalize.js's 3 s reference (different seed,
// different chord, longer): the gate must prove presets are consistent on
// guitar-like material in general, not just on the exact calibration signal.
const SIG_SEC = 5.0;
function makeGuitarSignal(lengthSec) {
  const n = Math.floor(SR * lengthSec);
  const out = new Float32Array(n);
  let seed = 777001;
  const rand = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return (seed / 0x7fffffff) * 2 - 1; };
  const pluck = (freq, t0, dur, vel) => {
    const N = Math.round(SR / freq);
    const line = new Float32Array(N);
    for (let i = 0; i < N; i++) line[i] = rand() * vel;
    const start = Math.floor(t0 * SR), end = Math.min(n, start + Math.floor(dur * SR));
    let idx = 0;
    for (let i = start; i < end; i++) {
      const cur = line[idx];
      const nxt = line[(idx + 1) % N];
      line[idx] = 0.996 * 0.5 * (cur + nxt);
      out[i] += cur;
      idx = (idx + 1) % N;
    }
  };
  const strum = (freqs, t0, vel) => freqs.forEach((f, i) => pluck(f, t0 + i * 0.012, 2.2, vel));
  const A = [110.0, 164.81, 220.0, 277.18, 329.63];   // A2 E3 A3 C#4 E4 (A major)
  strum(A, 0.05, 0.9);
  strum(A, 1.25, 0.7);
  pluck(146.83, 2.4, 1.0, 0.85);  // D3
  pluck(220.0, 2.9, 1.0, 0.8);    // A3
  pluck(293.66, 3.4, 1.3, 0.9);   // D4
  let peak = 0;
  for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(out[i]));
  const k = peak > 0 ? 0.251 / peak : 1;               // -12 dBFS peak
  for (let i = 0; i < n; i++) out[i] *= k;
  return out;
}

const peakOf = (channels) => {
  let p = 0;
  for (const ch of channels) for (let i = 0; i < ch.length; i++) { const a = Math.abs(ch[i]); if (a > p) p = a; }
  return p;
};

// Await THIS offline render's neural readiness (events tagged offline:true).
function awaitNeuralReady(timeoutMs) {
  return new Promise((resolve) => {
    const done = (v) => { cleanup(); resolve(v); };
    const t = setTimeout(() => done(false), timeoutMs);
    const ok = (e) => { if (e.detail && e.detail.offline) done(true); };
    const bad = (e) => { if (e.detail && e.detail.offline) done(false); };
    const cleanup = () => {
      clearTimeout(t);
      window.removeEventListener('neural-amp-ready', ok);
      window.removeEventListener('neural-amp-error', bad);
    };
    window.addEventListener('neural-amp-ready', ok);
    window.addEventListener('neural-amp-error', bad);
  });
}

// Render chain + reverb + normGain against the verification signal; measure.
let guitarSig = null;
async function renderChain(chain, reverb, normLinear, { neural, firstNeural }) {
  const len = Math.floor(SR * SIG_SEC);
  const oc = new OfflineAudioContext(2, len, SR);
  try { await loadWorklets(oc); } catch (e) { return { error: 'loadWorklets: ' + e.message }; }

  const buf = oc.createBuffer(1, len, SR);
  buf.getChannelData(0).set(guitarSig);
  const src = oc.createBufferSource(); src.buffer = buf;

  const readyP = neural ? awaitNeuralReady(firstNeural ? 30000 : 12000) : null;
  let engine;
  try { engine = buildChain(oc, chain, registry); } catch (e) { return { error: 'buildChain: ' + e.message }; }
  src.connect(engine.input);
  let tail = engine.output;
  if (reverb && (reverb.mix || 0) > 0) {
    const rv = reverbFx.create(oc, reverb);
    tail.connect(rv.input); tail = rv.output;
  }
  const norm = oc.createGain(); norm.gain.value = normLinear;
  tail.connect(norm); norm.connect(oc.destination);
  src.start();

  if (neural && !(await readyP)) return { error: 'neural handshake timeout (offline)' };
  const rendered = await oc.startRendering();
  const channels = [rendered.getChannelData(0), rendered.getChannelData(1)];
  return { lufs: integratedLufs(channels, SR), peak: peakOf(channels) };
}

const dB = (lin) => 20 * Math.log10(Math.max(1e-9, lin));

async function auditPreset(preset, category, firstNeural) {
  const { rest, reverb } = extractReverb(preset.chain);
  const ampReverb = reverb || { size: 0.4, mix: 0 };
  const r = chainState.fromPreset(rest, 1);
  const engineChain = chainState.toEngineChain(r.chain);
  const neural = isNeuralChain(engineChain);

  // The gain the APP applies — its exact code path, for every preset alike.
  const appGainLin = await measureLoudnessGain(engineChain, { sampleRate: SR, reverb: ampReverb });
  // The UNCLAMPED value, to see where the clamp bites.
  const raw = await measureLoudnessGain(engineChain, { sampleRate: SR, reverb: ampReverb, min: 1e-4, max: 1e4 });

  const res = await renderChain(engineChain, ampReverb, appGainLin, { neural, firstNeural });
  return {
    name: preset.name, category, neural,
    appGainDb: +dB(appGainLin).toFixed(2),
    unclampedGainDb: +dB(raw).toFixed(2),
    lufs: res.lufs == null ? null : +res.lufs.toFixed(2),
    peak: res.peak == null ? null : +res.peak.toFixed(4),
    error: res.error || null,
  };
}

async function run() {
  guitarSig = makeGuitarSignal(SIG_SEC);
  const rows = [];
  let neuralSeen = false;
  for (const cat of GB_CATEGORIES) {
    for (const preset of cat.presets) {
      const neural = preset.chain.some((e) => e.type === 'neuralamp');
      let row;
      try {
        row = await auditPreset(preset, cat.label, neural && !neuralSeen);
      } catch (e) {
        row = { name: preset.name, category: cat.label, error: String(e && e.message || e) };
      }
      if (neural) neuralSeen = true;
      rows.push(row);
      console.log(`[audit] ${cat.label} :: ${preset.name} -> ${row.error ? 'ERR ' + row.error : row.lufs + ' LUFS'}`);
    }
  }
  return { sampleRate: SR, signalSeconds: SIG_SEC, targetLufs: TARGET_LUFS, rows };
}

window.__loudnessAudit = { run };
</script>
</body>
