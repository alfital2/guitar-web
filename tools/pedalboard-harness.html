<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Pedalboard harness</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Bungee&family=Bungee+Inline&family=Audiowide&family=Orbitron:wght@600;800&family=Special+Elite&family=Major+Mono+Display&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#0d0d10;color:#e8e8ea;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;padding:28px}
  /* --- copied pedal CSS under test --- */
  .pedalboard{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px;padding:16px;
    background:repeating-linear-gradient(45deg,rgba(0,0,0,.15) 0 2px,transparent 2px 6px),#0d0d10;border-radius:10px;border:1px solid rgba(255,255,255,.04)}
  .connector{display:flex;align-items:center;align-self:center;color:#252528;font-size:18px;flex-shrink:0}
  .pedal{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.4)}
  .pedal-art{display:block;width:100%;height:auto}
  .pedal-grip{position:absolute;inset:0;z-index:1;cursor:grab}
  .pedal-knobs{position:absolute;left:0;right:0;top:99px;z-index:2;display:flex;justify-content:center;align-items:flex-start;gap:6px;pointer-events:none}
  .pedal-knobs .knob{pointer-events:auto}
  .pedal-knobs .knob .label{display:none}
  .pedal-knobs .knob .val{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.7)}
  .pedal-led{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;z-index:2;background:var(--pedal-color);box-shadow:0 0 7px var(--pedal-color),0 0 2px #fff}
  .amp-anchor{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:56px;align-self:stretch;padding:8px 10px;border-radius:11px;background:rgba(255,159,10,.1);border:1px dashed rgba(255,159,10,.4);color:#ff9f0a}
  .amp-anchor-icon{font-size:14px}.amp-anchor-label{font-size:8px;font-weight:800;letter-spacing:.16em}
  .pedal-add-wrap{align-self:stretch;display:flex}.pedal-add{min-width:44px;align-self:stretch;border-radius:11px;font-size:20px;color:#666;background:rgba(255,255,255,.02);border:1px dashed rgba(255,255,255,.12);cursor:pointer}
</style></head>
<body>
<div id="chain"></div>
<script type="module">
  import { renderPedalboard } from '../src/chain-ui/pedalboard.js';
  const P = (key,label,min,max,step,def,unit)=>({key,label,min,max,step,default:def,unit});
  const u = (instanceId,type,label,params,vals,locked=false)=>({instanceId,type,locked,schema:{label,params},params:vals});
  const units = [
    u(1,'compressor','Compressor',[P('threshold','Threshold',-60,0,1,-18,'dB'),P('ratio','Ratio',1,20,.1,2.5),P('attack','Attack',0,.1,.001,.005,'s'),P('release','Release',0,1,.01,.25,'s'),P('makeup','Makeup',0,12,.1,3,'dB')],{threshold:-18,ratio:2.5,attack:.005,release:.25,makeup:3}),
    u(2,'fuzz','Fuzz',[P('sustain','Sustain',0,10,.1,6),P('tone','Tone',0,10,.1,5),P('vol','Volume',0,10,.1,7)],{sustain:6,tone:5,vol:7}),
    u(3,'chorus','Chorus',[P('rate','Rate',0,10,.1,2),P('depth','Depth',0,10,.1,4),P('mix','Mix',0,1,.01,.4)],{rate:2,depth:4,mix:.4}),
    u(4,'delay','Delay',[P('time','Time',0,1000,1,375,'ms'),P('fdbk','Fdbk',0,1,.01,.35),P('tone','Tone',0,10,.1,6),P('mix','Mix',0,1,.01,.3)],{time:375,fdbk:.35,tone:6,mix:.3}),
    u(5,'drive','Drive',[P('amount','Amount',0,10,.1,2.5)],{amount:2.5},true),
    u(6,'reverb','Reverb',[P('decay','Decay',0,10,.1,4),P('mix','Mix',0,1,.01,.3)],{decay:4,mix:.3}),
    u(7,'widener','Widener',[P('width','Width',0,1,.01,.6)],{width:.6}),
    u(8,'tape-echo','Tape Echo',[P('space','Space',0,10,.1,3),P('time','Time',0,1000,1,420,'ms'),P('fdbk','Fdbk',0,1,.01,.4),P('tone','Tone',0,10,.1,5),P('mix','Mix',0,1,.01,.35)],{space:3,time:420,fdbk:.4,tone:5,mix:.35}),
    u(9,'octave','Octave Fuzz',[P('octave','Octave',0,10,.1,5),P('fuzz','Fuzz',0,10,.1,6),P('tone','Tone',0,10,.1,5),P('vol','Vol',0,10,.1,7)],{octave:5,fuzz:6,tone:5,vol:7}),
  ];
  renderPedalboard(document.getElementById('chain'), units, {onParamChange(){},onAdd(){},onRemove(){},onMove(){}});
</script>
</body></html>
